<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phigros B30 看板</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @font-face {
      font-family: 'MyFont';
      src: url('./font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    :root {
      --AT: #6e6e6e; --IN: #ff0000; --HD: #00b0f0; --EZ: #92d050;
      --clipSlope: 0.3;
      --radius: 16px;
      --radius-sm: 10px;
      --accent: #6c5ce7;
      --accent-hover: #5a4bd1;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'MyFont', 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      width: 1200px;
      min-height: 100vh;
      background-color: #0a0a0a;
      margin: 0 auto;
      padding: 20px 0 40px;
      position: relative;
      color: white;
    }
    body p { margin: 0; }
    .background { position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; overflow:hidden; }
    .background img { width:100%; height:100%; object-fit:cover; filter: blur(40px) brightness(0.5); }

    /* 凭证卡片 */
    .credential-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.15);
      width: 96%;
      max-width: 1160px;
      margin-left: auto;
      margin-right: auto;
      z-index: 2;
    }
    .credential-card .card-title {
      font-size: 20px; font-weight: 600; margin-bottom: 18px;
      color: white; display: flex; align-items: center; gap: 8px;
    }
    .credential-card .mode-toggle {
      display: flex; gap: 6px; background: rgba(255,255,255,0.10);
      padding: 4px; border-radius: var(--radius-sm); margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.10); width: fit-content;
    }
    .credential-card .mode-toggle button {
      padding: 10px 20px; border: none; border-radius: 8px; background: transparent;
      font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.6);
      cursor: pointer; transition: 0.25s; font-family: 'MyFont', sans-serif;
    }
    .credential-card .mode-toggle button.active {
      background: rgba(255,255,255,0.20); color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .credential-card .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .credential-card .field label { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7); }
    .credential-card .field input {
      padding: 12px 16px; border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: var(--radius-sm); font-size: 15px; font-family: 'MyFont', sans-serif;
      background: rgba(255,255,255,0.06); transition: 0.25s; outline: none;
      color: white; width: 100%;
    }
    .credential-card .field input:focus {
      border-color: var(--accent); box-shadow: 0 0 0 4px rgba(108,92,231,0.20);
    }
    .credential-card .field input::placeholder { color: rgba(255,255,255,0.3); }
    .credential-card .hint { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 4px; }
    .credential-card .actions { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .credential-card .btn {
      padding: 12px 32px; border: none; border-radius: var(--radius-sm);
      font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.25s;
      font-family: 'MyFont', sans-serif;
    }
    .credential-card .btn-primary { background: var(--accent); color: #fff; }
    .credential-card .btn-primary:hover {
      background: var(--accent-hover); transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(108,92,231,0.30);
    }
    .credential-card .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .credential-card .btn-secondary { background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.8); }
    .credential-card .btn-secondary:hover { background: rgba(255,255,255,0.20); }
    .credential-card .btn-scan {
      background: rgba(0,180,255,0.25); border: 1px solid rgba(0,180,255,0.3); color: white;
    }
    .credential-card .btn-scan:hover { background: rgba(0,180,255,0.4); }
    .credential-card .status {
      padding: 14px 18px; border-radius: var(--radius-sm); margin-top: 16px;
      font-size: 14px; display: none; align-items: center; gap: 10px;
      border: 1px solid transparent;
    }
    .credential-card .status.show { display: flex; }
    .credential-card .status.loading {
      background: rgba(30,80,200,0.20); border-color: rgba(70,130,255,0.3); color: #8ab4f8;
    }
    .credential-card .status.error {
      background: rgba(200,50,50,0.20); border-color: rgba(255,80,80,0.3); color: #f28b82;
    }
    .credential-card .status.success {
      background: rgba(0,180,100,0.20); border-color: rgba(0,220,130,0.3); color: #81c995;
    }
    .credential-card .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2.5px solid rgba(108,92,231,0.20); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 二维码区域 */
    .qr-container {
      margin-top: 16px; padding: 16px; background: rgba(255,255,255,0.05);
      border-radius: var(--radius-sm); border: 1px dashed rgba(255,255,255,0.2);
      display: none; text-align: center;
    }
    .qr-container.active { display: block; }
    .qr-container #qrcode {
      display: inline-block; background: white; padding: 10px;
      border-radius: 8px; margin-bottom: 10px; min-height: 200px; min-width: 200px;
    }
    .qr-container .qr-hint { font-size: 14px; color: rgba(255,255,255,0.6); }
    .qr-container .qr-hint strong { color: white; }
    .qr-container .qr-error { color: #f28b82; font-size: 14px; margin-top: 8px; }

    /* 玩家信息区 */
    .title { display: flex; justify-content: center; align-items: center; width: 100%; margin: 1rem 0 2rem; z-index: 2; padding: 0 20px; }
    .playerInfo {
      display: flex; align-items: stretch; width: 96%; max-width: 1160px;
      height: 120px; background: rgba(0,0,0,0.55); backdrop-filter: blur(5px);
      border-radius: 8px; padding: 10px 20px; position: relative; gap: 20px;
    }
    .playerInfo .avatar {
      flex-shrink: 0; width: 80px; height: 80px; display: flex;
      align-items: center; justify-content: center; border-radius: 50%;
      overflow: hidden; background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.3); margin-top: 5px;
    }
    .playerInfo .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .info-group { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
    .info-group .top-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .info-group .top-row .date { margin-left: auto; color: rgba(255,255,255,0.85); font-size: 16px; white-space: nowrap; }
    .mode-group { display: flex; align-items: center; gap: 6px; margin-left: 12px; }
    .mode-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1);
      color: #ccc; font-size: 13px; font-family: 'MyFont', sans-serif;
      cursor: pointer; transition: all 0.2s; display: flex;
      align-items: center; justify-content: center; font-weight: bold;
    }
    .mode-btn:hover { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.7); }
    .mode-btn.active { background: #00b0f0; border-color: #00b0f0; color: white; box-shadow: 0 0 12px #00b0f0aa; }
    .mode-label { font-size: 14px; color: rgba(255,255,255,0.6); margin-left: 4px; white-space: nowrap; }
    .info-group .clgBox {
      display: flex; align-items: center; justify-content: center;
      position: relative; width: 52px; height: 36px; flex-shrink: 0;
    }
    .info-group .clgBox img { width: 100%; height: 100%; object-fit: contain; }
    .info-group .clgBox .challenge-text {
      position: absolute; font-size: 20px; font-weight: bold; color: white;
      text-shadow: 0 0 6px rgba(0,0,0,0.9), 0 0 3px #000; line-height: 1; margin-top: 2px;
    }
    .info-group .rks {
      background: white; color: black; padding: 2px 16px; border-radius: 20px;
      font-size: 22px; font-weight: bold; letter-spacing: 1px; flex-shrink: 0; line-height: 1.4;
    }
    .info-group .mid-row { display: flex; align-items: center; }
    .info-group .playerId {
      font-size: 28px; font-weight: bold; color: white; letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0,150,255,0.3);
    }
    .info-group .bottom-row { display: flex; align-items: center; gap: 12px; }
    .info-group .dataBox {
      display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.85);
      font-size: 16px; background: rgba(0,0,0,0.35); padding: 2px 14px 2px 8px; border-radius: 16px;
    }
    .info-group .dataBox img { height: 20px; width: auto; filter: brightness(0) invert(1); }
    .recordInfo {
      flex-shrink: 0; width: 28%; min-width: 260px; background: rgba(0,0,0,0.4);
      backdrop-filter: blur(3px); border-radius: 6px; padding: 6px 12px 6px 18px;
      display: flex; align-items: center; position: relative;
      border-left: 3px solid rgba(255,255,255,0.2); margin-right: -5px;
    }
    .recordInfo .sheet { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-around; }
    .recordInfo .row { display: flex; align-items: center; justify-content: flex-start; gap: 0; height: 22%; }
    .recordInfo .poz { width: 22%; text-align: center; font-size: 14px; color: white; flex-shrink: 0; }
    .recordInfo .poz:first-child { width: 12%; text-align: left; font-weight: bold; color: #aac; }
    .recordInfo .poz p { font-size: 14px; margin: 0; }
    .recordInfo .row:first-child .poz { font-weight: bold; color: #8cf; }
    .recordInfo .row:first-child .poz:first-child { color: white; }

    /* 歌曲网格 */
    .song-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 8px;
      width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px 0 15px;
      box-sizing: border-box; z-index: 5;
    }
    .song-grid .song {
      width: 100%; height: 100px; display: flex; flex-direction: row;
      align-items: center; position: relative; border-radius: 4px;
      overflow: hidden; margin: 0; padding-left: 25px; background: transparent;
    }
    .song.phi_song .info-AT, .song.phi_song .info-IN,
    .song.phi_song .info-HD, .song.phi_song .info-EZ {
      filter: drop-shadow(0 0 10px #fbff00aa);
    }
    .song .ill-box {
      width: 50%; height: auto; z-index: 1; filter: drop-shadow(2px 4px 10px #00000055);
      position: relative; flex-shrink: 0;
    }
    .num {
      width: 18%; --height: 15.6px; margin-left: 0; background-color: rgba(255,255,255,1);
      position: absolute; text-align: center; z-index: 2; top: 0; left: 2px; height: 15.6px;
      clip-path: polygon(100% 0, calc(100% - calc(15.6px * 0.3)) 100%, 0 100%, calc(15.6px * 0.3) 0);
      overflow: hidden;
    }
    .num p { font-size: xx-small; line-height: 130%; color: black; margin: 0; }
    .ill {
      --height: 94.92px; width: 100%; overflow: hidden;
      clip-path: polygon(100% 0, calc(100% - calc(94.92px * 0.3)) 100%, 0 100%, calc(94.92px * 0.3) 0);
    }
    .ill img { width: 100%; display: block; }
    .rank-AT, .rank-IN, .rank-HD, .rank-EZ {
      width: 33%; --height: 31.32px; bottom: 0px; position: absolute; margin-left: -5%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 13px; color: white; background: rgba(0,0,0,0.7); line-height: 1.3;
      clip-path: polygon(100% 0, calc(100% - calc(31.32px * 0.3)) 100%, 0 100%, calc(31.32px * 0.3) 0);
      overflow: hidden;
    }
    .rank-AT { background: var(--AT); }
    .rank-IN { background: var(--IN); }
    .rank-HD { background: var(--HD); }
    .rank-EZ { background: var(--EZ); }
    .rank-AT .org, .rank-IN .org, .rank-HD .org, .rank-EZ .org,
    .rank-AT .rel, .rank-IN .rel, .rank-HD .rel, .rank-EZ .rel {
      width: 100%; text-align: center; color: white;
    }
    .rank-AT .org, .rank-IN .org, .rank-HD .org, .rank-EZ .org { font-size: 13px; }
    .rank-AT .rel, .rank-IN .rel, .rank-HD .rel, .rank-EZ .rel { font-size: 13px; }
    .info-AT, .info-IN, .info-HD, .info-EZ {
      margin-left: -9.1%; padding-left: 7%; border-right: 3px solid;
      width: 52%; height: 90%; filter: drop-shadow(2px 4px 10px #00000055);
      backdrop-filter: blur(5px); position: absolute; right: 4%; top: 5%;
      background-color: rgba(0,183,240,0.3); border-color: rgb(0,183,240);
      display: flex; flex-direction: column; justify-content: center;
    }
    .info-AT { background-color: rgba(240,0,0,0.3); border-color: rgb(255,0,0); }
    .songname {
      width: 100%; height: auto; margin-left: 5%; display: flex;
      justify-content: center; align-items: center; max-height: 2.6em;
      overflow: hidden; line-height: 1.3; text-align: center;
    }
    .songname p {
      margin: 0; color: white; word-break: break-word; text-align: center;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; text-overflow: ellipsis; line-height: 1.3;
    }
    .songinfo {
      width: 100%; height: 70%; text-align: center; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .Rating { width: 20%; height: auto; position: absolute; top: 10%; left: 5%; }
    .Rating img { width: 100%; filter: drop-shadow(0 0 10px #ffffffbb); display: block; }
    .chengji {
      width: 80%; height: 100%; margin-left: 18%; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .score p { font-size: x-large; color: white; }
    .acc-box { width: 100%; display: flex; align-items: center; justify-content: space-evenly; }
    .acc p { font-size: 0.9rem; color: white; }
    .suggest {
      padding: 2px 10px; border-radius: 30px; background: rgba(0,0,0,0.5);
      filter: drop-shadow(0 0 2px rgba(128,128,128,0.667));
      font-size: 10px; font-weight: bold; color: #ffffff;
      text-shadow: 0 0 2px #000000ac; text-align: center; white-space: nowrap;
    }
    .over_flow {
      width: 100%; height: 30px; display: flex; align-items: center;
      justify-content: space-evenly; margin: 20px 0;
    }
    .flow_line_box_l, .flow_line_box_r { display: flex; width: 38%; justify-content: center; }
    .flow_line {
      background-color: #ffffff; height: 15px; --rpoz: 5.5px;
      clip-path: polygon(100% 0%, calc(100% - var(--rpoz)) 100%, 0% 100%, var(--rpoz) 0%);
      overflow: hidden;
    }
    .flow_line_box_l .flow_line:nth-child(1), .flow_line_box_r .flow_line:nth-child(6) { width: 50%; }
    .flow_line_box_l .flow_line:nth-child(2), .flow_line_box_r .flow_line:nth-child(5) { width: 25%; }
    .flow_line_box_l .flow_line:nth-child(3), .flow_line_box_r .flow_line:nth-child(4) { width: 12.5%; }
    .flow_line_box_l .flow_line:nth-child(4), .flow_line_box_r .flow_line:nth-child(3) { width: 6.25%; }
    .flow_line_box_l .flow_line:nth-child(5), .flow_line_box_r .flow_line:nth-child(2) { width: 3.125%; }
    .flow_line_box_l .flow_line:nth-child(6), .flow_line_box_r .flow_line:nth-child(1) { width: 1.5625%; }
    .over_flow p { font-size: 25px; font-family: 'MyFont', sans-serif; color: white; }

    .createdbox {
      width: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; z-index: 10; margin-top: 40px; gap: 12px; padding: 0 20px;
    }
    .brand-row { display: flex; align-items: baseline; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .brand-name {
      font-size: 70px; color: white; text-shadow: 0 0 20px #00baff;
      font-family: 'MyFont', sans-serif; letter-spacing: 3px; line-height: 1;
    }
    .brand-version {
      font-size: 26px; color: #fff700; text-shadow: 0 0 20px #fff700aa;
      font-family: 'MyFont', sans-serif; align-self: flex-start; margin-top: -8px; line-height: 1;
    }
    .watermark {
      font-size: 14px; color: rgba(255,255,255,0.3); letter-spacing: 1px;
      font-family: 'MyFont', sans-serif; text-shadow: 0 0 4px rgba(0,0,0,0.5);
    }
    .save-btn-wrap { margin-top: 8px; }
    .save-btn {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4);
      color: white; padding: 10px 28px; border-radius: 30px; font-size: 18px;
      font-family: 'MyFont', sans-serif; cursor: pointer; transition: all 0.3s;
      backdrop-filter: blur(4px); box-shadow: 0 0 15px rgba(0,180,255,0.2);
    }
    .save-btn:hover { background: rgba(255,255,255,0.3); box-shadow: 0 0 30px rgba(0,180,255,0.5); transform: scale(1.02); }
    .save-btn:active { transform: scale(0.96); }
    .save-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

    .b30-toolbar {
      display: flex; justify-content: flex-end; align-items: center; gap: 12px;
      width: 96%; max-width: 1160px; margin: 0 auto 12px; z-index: 5;
    }
    .cache-info { font-size: 13px; color: rgba(255,255,255,0.5); }
    .btn-export {
      background: rgba(0,180,100,0.3); border: 1px solid rgba(0,220,130,0.3);
      color: white; padding: 8px 18px; border-radius: var(--radius-sm);
      font-size: 13px; font-family: 'MyFont', sans-serif; cursor: pointer;
      transition: 0.25s; backdrop-filter: blur(4px);
    }
    .btn-export:hover { background: rgba(0,180,100,0.5); }
    .diagnostic-box {
      background: rgba(30,80,200,0.15); border: 1px solid rgba(70,130,255,0.2);
      padding: 12px 16px; border-radius: var(--radius-sm); margin: 10px 0;
      font-size: 13px; color: rgba(255,255,255,0.7);
      width: 96%; max-width: 1160px; margin-left: auto; margin-right: auto;
    }
    .diagnostic-box .unmatched { color: #f28b82; font-weight: 500; }
    .diagnostic-box .matched { color: #81c995; font-weight: 500; }

    @media (max-width: 760px) {
      .song-grid { padding: 0 10px; }
      .credential-card { padding: 16px; }
      .playerInfo { flex-wrap: wrap; height: auto; padding: 10px; gap: 10px; }
      .recordInfo { width: 100%; min-width: unset; margin-right: 0; }
      .info-group .top-row { flex-wrap: wrap; }
      .info-group .top-row .date { margin-left: 0; }
      .mode-group { margin-left: 0; }
      body { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="background"><img src="" alt="背景" id="bkg"></div>

  <!-- 凭证输入卡片 -->
  <div class="credential-card">
    <div class="card-title">🔐 凭证输入</div>
    <div class="mode-toggle" id="credentialModeToggle">
      <button class="active" data-mode="session">🔑 Session Token</button>
      <button data-mode="api">🔓 API User ID</button>
    </div>
    <div class="field">
      <label for="credentialInput"><span id="credentialLabel">Session Token</span></label>
      <input type="text" id="credentialInput" placeholder="例如: uhrmqs8v0mmn0ikzxqgozrctr">
      <span class="hint" id="credentialHint">输入你的游戏 Session Token</span>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="fetchBtn">📥 获取并生成 B30</button>
      <button type="button" class="btn btn-secondary" id="clearBtn">🗑️ 清空</button>
      <button type="button" class="btn btn-scan" id="scanBtn">📱 扫码登录</button>
    </div>
    <div class="qr-container" id="qrContainer">
      <div id="qrcode"></div>
      <p class="qr-hint">使用 <strong>TapTap</strong> 扫码登录，二维码有效期为 <span id="qrExpire">--</span> 秒</p>
      <p class="qr-hint" id="qrStatus">等待扫码...</p>
      <p class="qr-error" id="qrError"></p>
    </div>
    <div class="status" id="statusMsg">
      <span class="icon">ℹ️</span>
      <span id="statusText">就绪</span>
    </div>
  </div>

  <div class="b30-toolbar" id="b30Toolbar" style="display:none;">
    <span class="cache-info" id="cacheInfo">💾 数据已缓存</span>
    <button class="btn-export" id="exportJsonBtn">📤 导出原始 JSON</button>
  </div>

  <div id="playerInfoContainer"></div>
  <div class="song-grid" id="mainGrid"></div>

  <div class="over_flow" id="overflowDivider" style="display:none;">
    <div class="flow_line_box_l">
      <div class="flow_line"></div><div class="flow_line"></div><div class="flow_line"></div>
      <div class="flow_line"></div><div class="flow_line"></div><div class="flow_line"></div>
    </div>
    <p><i>OVER FLOW</i></p>
    <div class="flow_line_box_r">
      <div class="flow_line"></div><div class="flow_line"></div><div class="flow_line"></div>
      <div class="flow_line"></div><div class="flow_line"></div><div class="flow_line"></div>
    </div>
  </div>
  <div class="song-grid" id="overflowGrid" style="display:none;"></div>

  <div class="createdbox">
    <div class="brand-row">
      <span class="brand-name">Phigros-Grades</span>
      <span class="brand-version">v.2.4.0.1.2</span>
    </div>
    <div class="watermark">generated by txt114514</div>
    <div class="save-btn-wrap">
      <button class="save-btn" id="saveBtn">📸 保存为图片</button>
    </div>
  </div>

  <script>
    // ======================== 全局数据 ========================
    let playerData = null;
    let diffMapDefault = {};
    let diffMapOld = {};
    let convertMap = {};
    let currentMode = 1;
    let currentPlayerName = 'Unknown';
    let currentTimeStr = '';
    let rawData = null;
    let difficultyLoadError = null;
    let songInfoMap = {};
    let abortScan = false;

    // ======================== DOM ========================
    const credentialModeToggle = document.getElementById('credentialModeToggle');
    const credentialInput = document.getElementById('credentialInput');
    const credentialLabel = document.getElementById('credentialLabel');
    const credentialHint = document.getElementById('credentialHint');
    const fetchBtn = document.getElementById('fetchBtn');
    const clearBtn = document.getElementById('clearBtn');
    const scanBtn = document.getElementById('scanBtn');
    const statusMsg = document.getElementById('statusMsg');
    const statusText = document.getElementById('statusText');
    const mainGrid = document.getElementById('mainGrid');
    const overflowGrid = document.getElementById('overflowGrid');
    const overflowDivider = document.getElementById('overflowDivider');
    const bkgImg = document.getElementById('bkg');
    const playerInfoContainer = document.getElementById('playerInfoContainer');
    const b30Toolbar = document.getElementById('b30Toolbar');
    const cacheInfo = document.getElementById('cacheInfo');
    const exportBtn = document.getElementById('exportJsonBtn');
    const qrContainer = document.getElementById('qrContainer');
    const qrCodeDiv = document.getElementById('qrcode');
    const qrExpire = document.getElementById('qrExpire');
    const qrStatus = document.getElementById('qrStatus');
    const qrError = document.getElementById('qrError');

    let credentialMode = 'session';
    const BACKEND = 'http://127.0.0.1:5000';

    // ======================== 工具 ========================
    function getSongId(key) { return key.replace(/\.0$/, ''); }
    function parseTSV(text) {
      return text.trim().split('\n').map(line => line.split('\t').map(cell => cell.trim()));
    }
    function parseConvert(text) {
      const map = {};
      for (const line of text.trim().split('\n')) {
        if (line.startsWith('原')) continue;
        const parts = line.split('\t');
        if (parts.length < 2) continue;
        const from = parts[0].trim();
        const to = parseFloat(parts[1].trim());
        if (isNaN(to)) continue;
        if (from.includes('-')) {
          const [low, high] = from.split('-').map(s => parseFloat(s.trim()));
          if (!isNaN(low) && !isNaN(high)) map[from] = { low, high, to };
        } else {
          const num = parseFloat(from);
          if (!isNaN(num)) map[num] = to;
        }
      }
      return map;
    }
    function applyConvert(constant) {
      if (constant === undefined || constant === null) return constant;
      if (convertMap[constant] !== undefined) return convertMap[constant];
      for (const key in convertMap) {
        const val = convertMap[key];
        if (typeof val === 'object' && val.low !== undefined) {
          if (constant >= val.low && constant <= val.high) return val.to;
        }
      }
      if (constant >= 14.0 && constant <= 15.5) return constant - 0.2;
      if (constant <= 13.9) return constant;
      return constant;
    }
    function getConstant(songId, difficulty) {
      const def = diffMapDefault[songId]?.[difficulty];
      if (currentMode === 1) return def !== undefined ? def : null;
      if (currentMode === 2) return def !== undefined ? applyConvert(def) : null;
      if (currentMode === 3) {
  const old = diffMapOld[songId]?.[difficulty];
  // old 为 0/NaN 表示 difficulty_old.tsv 中该难度不存在，应回退到转换
  if (old !== undefined && old !== null && old > 0 && !isNaN(old)) return old;
  return def !== undefined ? applyConvert(def) : null;
}
      return null;
    }
    function pad(n) { return String(n).padStart(2, '0'); }
    function formatDateDisplay(isoStr) {
      let d = isoStr ? new Date(isoStr) : new Date();
      if (isNaN(d.getTime())) d = new Date();
      return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    function formatDateForFilename(isoStr) {
      if (!isoStr) return 'unknown';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return 'unknown';
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
    }
    function formatData(moneyArr) {
      if (!moneyArr || moneyArr.length < 5) return '--';
      const units = ['KiB', 'MiB', 'GiB', 'TiB', 'PiB'];
      const result = [];
      for (let i = moneyArr.length - 1; i >= 0; i--) {
        if (moneyArr[i] > 0) {
          result.push(`${moneyArr[i]}${units[i]}`);
          if (result.length === 3) break;
        }
      }
      if (result.length === 0) result.push('0KiB');
      return result.join(' ');
    }

    // localStorage
    const STORAGE_KEY = 'b30_raw_data';
    function saveRawData(data) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {} }
    function loadRawData() {
      try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
    }
    function clearRawData() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }

    function exportRawJSON() {
      if (!rawData) { alert('没有原始数据可导出'); return; }
      const blob = new Blob([JSON.stringify(rawData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `phigros_cloud_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function setStatus(type, message, icon) {
      statusMsg.className = 'status show ' + type;
      statusText.textContent = message;
      const iconEl = statusMsg.querySelector('.icon');
      if (iconEl) iconEl.textContent = icon || 'ℹ️';
    }
    function hideStatus() { statusMsg.className = 'status'; }

    // 加载定数 + 曲名
    async function loadDifficulty() {
      try {
        difficultyLoadError = null;
        const defRes = await fetch('difficulty.tsv');
        if (!defRes.ok) throw new Error('无法加载 difficulty.tsv');
        parseTSV(await defRes.text()).forEach(row => {
          const [id, ez, hd, in_, at] = row;
          diffMapDefault[id] = {
            EZ: parseFloat(ez) || 0, HD: parseFloat(hd) || 0,
            IN: parseFloat(in_) || 0, AT: parseFloat(at) || 0
          };
        });
        try {
          const oldRes = await fetch('difficulty_old.tsv');
          if (oldRes.ok) {
            parseTSV(await oldRes.text()).forEach(row => {
              const [id, ez, hd, in_, at] = row;
              diffMapOld[id] = {
                EZ: parseFloat(ez) || 0, HD: parseFloat(hd) || 0,
                IN: parseFloat(in_) || 0, AT: parseFloat(at) || 0
              };
            });
          }
        } catch (e) {}
        try {
          const convRes = await fetch('diff_convent.txt');
          if (convRes.ok) convertMap = parseConvert(await convRes.text());
        } catch (e) {}
        try {
          const infoRes = await fetch('info.tsv');
          if (infoRes.ok) {
            parseTSV(await infoRes.text()).forEach(row => {
              const [id, title, ...rest] = row;
              if (id && title) songInfoMap[id.replace(/\.0$/, '')] = { title: title.trim(), rest };
            });
          }
        } catch (e) {}
        return true;
      } catch (e) {
        difficultyLoadError = e.message || '未知错误';
        return false;
      }
    }

    // ======================== TapTap 扫码（Python 后端） ========================
    async function startScanFlow() {
      qrError.textContent = '';
      qrStatus.textContent = '正在连接 Python 后端...';
      qrCodeDiv.innerHTML = '';
      qrContainer.classList.add('active');
      abortScan = false;

      try {
        // 1) 请求二维码
        let qrResp;
        try {
          qrResp = await fetch(`${BACKEND}/api/qrcode`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}'
          });
        } catch (e) {
          throw new Error(
            '无法连接到 Python 后端。\n' +
            '请确认已在项目目录运行：pip install flask flask-cors && python server.py\n' +
            '并检查 http://127.0.0.1:5000 是否可访问。'
          );
        }
        if (!qrResp.ok) throw new Error(`后端返回 HTTP ${qrResp.status}`);
        const qrJson = await qrResp.json();
        if (!qrJson.ok) throw new Error(qrJson.error || '获取二维码失败');

        const qr = qrJson.qr || {};
        const qrUrl =
          qr.qrcode_url ||
          qr.verification_uri_complete ||
          qr.verification_url_complete ||
          qr.verification_uri ||
          qr.verification_url;
        if (!qrUrl) {
          throw new Error('后端未返回二维码链接：' + JSON.stringify(qr).slice(0, 200));
        }

        qrExpire.textContent = qr.expires_in || '--';
        new QRCode(qrCodeDiv, {
          text: qrUrl,
          width: 200,
          height: 200,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
        qrStatus.textContent = '请使用 TapTap 扫码并确认登录';

        // 2) 轮询
        const startTime = Date.now();
        const totalTimeout = (qr.expires_in || 120) * 1000;
        const intervalMs = (qr.interval || 2) * 1000;
        let token = null;

        while (!abortScan && Date.now() - startTime < totalTimeout) {
          await new Promise(r => setTimeout(r, intervalMs));
          if (abortScan) break;

          let pollResp;
          try {
            pollResp = await fetch(`${BACKEND}/api/poll`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                device_code: qr.device_code,
                device_id: qr.device_id,
                interval: qr.interval,
                expires_in: qr.expires_in
              })
            });
          } catch (e) {
            // 网络抖动继续
            continue;
          }
          if (!pollResp.ok) continue;
          const pollJson = await pollResp.json();

          if (pollJson.ok && pollJson.state === 'ok' && pollJson.token) {
            token = pollJson.token;
            break;
          }
          if (pollJson.ok && pollJson.state === 'denied') {
            throw new Error(pollJson.message || '你在 TapTap 中拒绝了登录');
          }
          if (pollJson.ok && pollJson.state === 'expired') {
            throw new Error(pollJson.message || '二维码已过期，请重新获取');
          }
          // pending 继续
          if (pollJson.message) qrStatus.textContent = '等待中：' + pollJson.message;
        }

        if (!token) throw new Error('扫码超时，请重新获取二维码');

        // 3) 换取 sessionToken
        qrStatus.textContent = '扫码成功，正在换取 Session Token...';
        const completeResp = await fetch(`${BACKEND}/api/complete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, qr })
        });
        if (!completeResp.ok) throw new Error(`换取 token 失败：HTTP ${completeResp.status}`);
        const completeJson = await completeResp.json();
        if (!completeJson.ok || !completeJson.sessionToken) {
          throw new Error(completeJson.error || '未能获取 sessionToken');
        }

        // 4) 填入并自动获取
        credentialInput.value = completeJson.sessionToken;
        credentialModeToggle.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-mode="session"]').classList.add('active');
        credentialMode = 'session';
        credentialLabel.textContent = 'Session Token';
        credentialHint.textContent = '输入你的游戏 Session Token';

        qrStatus.textContent = '✅ 登录成功，Session Token 已自动填入';
        setStatus('success', '✅ 扫码成功，正在加载数据...', '✅');
        qrContainer.classList.remove('active');
        fetchAndGenerate();

      } catch (err) {
        console.error('扫码失败:', err);
        const msg = err && err.message ? err.message : String(err);
        qrError.textContent = '❌ ' + msg;
        qrStatus.textContent = '扫码出错';
        setStatus('error', '扫码失败：' + msg, '❌');
      }
    }

    // ======================== 渲染 ========================
    function renderPage() {
      if (!playerData) {
        mainGrid.innerHTML = '<p style="color:white;text-align:center;width:100%;">暂无数据，请获取云存档。</p>';
        return;
      }
      const summary = playerData.saveInfo.summary;
      const gameuser = playerData.gameuser;
      const playerId = playerData.saveInfo.PlayerId || gameuser.name || 'Unknown';
      currentPlayerName = playerId;

      const avatarName = gameuser.avatar || 'default';
      const challengeRank = summary.challengeModeRank || 0;
      const rankStr = String(challengeRank).padStart(3, '0');
      const firstDigit = rankStr.charAt(0);
      const lastTwo = rankStr.slice(1);
      const modTime = playerData.saveInfo.modifiedAt;
      currentTimeStr = modTime || new Date().toISOString();
      const dateStr = formatDateDisplay(modTime);
      const money = playerData.gameProgress?.money || [0,0,0,0,0];
      const dataStr = formatData(money);
      let rksTotal = summary.rankingScore || 0;
      const labelMap = { 1: 'diff_mode: default', 2: 'diff_mode: 2', 3: 'diff_mode: default:3' };

      playerInfoContainer.innerHTML = `
        <div class="title">
          <div class="playerInfo">
            <div class="avatar">
              <img src="./avatar/${avatarName}.png" alt="avatar" onerror="this.src='./avatar/default.png'">
            </div>
            <div class="info-group">
              <div class="top-row">
                <div class="clgBox">
                  <img src="./rank/${firstDigit}.png" alt="challenge" onerror="this.style.display='none'">
                  <span class="challenge-text">${lastTwo}</span>
                </div>
                <span class="rks">${rksTotal.toFixed(4)}</span>
                <span class="mode-group">
                  <button class="mode-btn ${currentMode===1?'active':''}" data-mode="1">1</button>
                  <button class="mode-btn ${currentMode===2?'active':''}" data-mode="2">2</button>
                  <button class="mode-btn ${currentMode===3?'active':''}" data-mode="3">3</button>
                  <span class="mode-label">${labelMap[currentMode]}</span>
                </span>
                <span class="date">${dateStr}</span>
              </div>
              <div class="mid-row"><span class="playerId">${playerId}</span></div>
              <div class="bottom-row">
                <span class="dataBox">
                  <img src="./rank/data.png" alt="data" onerror="this.style.display='none'">
                  <span>${dataStr}</span>
                </span>
              </div>
            </div>
            <div class="recordInfo"><div class="sheet" id="recordSheet"></div></div>
          </div>
        </div>`;

      // 统计表
      const cleared = summary.cleared || [0,0,0,0];
      const fullCombo = summary.fullCombo || [0,0,0,0];
      const phi = summary.phi || [0,0,0,0];
      const labels = ['EZ', 'HD', 'IN', 'AT'];
      const rows = [
        { label: '\\', data: labels },
        { label: 'C', data: cleared },
        { label: 'FC', data: fullCombo },
        { label: 'Phi', data: phi }
      ];
      let sheetHtml = '';
      rows.forEach((row, ri) => {
        sheetHtml += `<div class="row">`;
        sheetHtml += `<div class="poz" style="width:12%;text-align:left;font-weight:bold;color:${ri===0?'white':'#aac'}"><p>${row.label}</p></div>`;
        row.data.forEach(val => {
          sheetHtml += `<div class="poz" style="width:22%;text-align:center;"><p>${val}</p></div>`;
        });
        sheetHtml += `</div>`;
      });
      document.getElementById('recordSheet').innerHTML = sheetHtml;

      // 条目
      const allEntries = [];
      const unmatched = [];
      for (const [songKey, diffArray] of Object.entries(playerData.gameRecord || {})) {
        if (!Array.isArray(diffArray)) continue;
        const songId = getSongId(songKey);
        diffArray.forEach((entry, idx) => {
          if (!entry || typeof entry !== 'object') return;
          const diff = ['EZ','HD','IN','AT'][idx];
          if (!diff) return;
          const constant = getConstant(songId, diff);
          if (constant === null || constant === undefined || constant === 0) {
            unmatched.push(`${songId} (${diff})`);
            return;
          }
          const acc = entry.acc || 0;
          if (acc < 70) return;
          const rks = constant * Math.pow((acc - 55) / 45, 2);
          allEntries.push({
            songId: songKey, diff, constant,
            score: entry.score || 0, acc,
            fc: entry.fc || false, rks,
            illustration: `./illustration/${songId}.png`,
            title: songInfoMap[songId]?.title || songKey,
            isPhi: (entry.score === 1000000 && acc === 100)
          });
        });
      }

      let diagHtml = '';
      if (unmatched.length > 0) {
        diagHtml = `
          <div class="diagnostic-box">
            <p><span class="matched">匹配定数：${allEntries.length} 条</span></p>
            <p><span class="unmatched">未匹配定数：${unmatched.length} 条</span></p>
            <p style="font-size:12px;">未匹配示例：${unmatched.slice(0,5).join('、')}${unmatched.length>5?' …':''}</p>
          </div>`;
      }

      if (allEntries.length === 0) {
        mainGrid.innerHTML = diagHtml + `<div class="diagnostic-box" style="color:#f28b82;border-color:#f28b82;"><p>❌ 所有成绩均未匹配到定数，无法生成 B30。</p></div>`;
        return;
      }

      // 排序：Phi3 + Best27 + Overflow
      const phiEntries = allEntries.filter(e => e.isPhi).sort((a,b) => b.constant - a.constant);
      const topPhi = phiEntries.slice(0, 3);
      const rest = [...allEntries.filter(e => !e.isPhi), ...phiEntries.slice(3)].sort((a,b) => b.rks - a.rks);
      const best27 = rest.slice(0, 27);
      const overflowList = rest.slice(27, 33);
      const mainList = [...topPhi, ...best27];
     // 按当前定数模式重算总 RKS，并更新顶部显示
const phiSum = topPhi.reduce((s, e) => s + e.rks, 0);
const bestSum = best27.reduce((s, e) => s + e.rks, 0);
const totalRKS = (phiSum + bestSum) / 30;
rksTotal = totalRKS;
const rksEl = playerInfoContainer.querySelector('.rks');
if (rksEl) rksEl.textContent = totalRKS.toFixed(4);

      b30Toolbar.style.display = 'flex';
      cacheInfo.textContent = rawData ? '💾 数据已缓存' : '📡 实时获取';

      function buildSongCard(song, label, isPhiFlag = false) {
        const rankImg = song.isPhi ? './rank/phi.png' : (song.fc ? './rank/fc.png' : './rank/v.png');
// 特殊曲目：曲绘使用 (id)_(难度).png
const SPECIAL_ILL_ID = 'WhatdoyouwantmorethanaHappyending.Apo11oHALOprogramft安月名莉子大瀬良あい';
const cleanId = song.songId.replace(/\.0$/, '');
const illSrc = (cleanId === SPECIAL_ILL_ID)
  ? `./illustration/${cleanId}_${song.diff}.png`
  : `./illustration/${cleanId}.png`;
        const constStr = song.constant.toFixed(1);
        const rksStr = song.rks.toFixed(2);
        const neededAcc = 55 + 45 * Math.sqrt((song.rks + 0.01) / song.constant);
        const suggestText = neededAcc > 100 ? '无法推分' : neededAcc.toFixed(2) + '%';
        const titleLen = song.title.length;
        const fontSize = titleLen > 15 ? 10 : titleLen > 10 ? 12 : titleLen > 6 ? 14 : 16;
        const suggestType = Math.floor(Math.random() * 6);
        return `
          <div class="song ${isPhiFlag ? 'phi_song' : ''}">
            <div class="ill-box">
              <div class="num" style="--height: 15.6px;"><p>${label}</p></div>
              <div class="ill" style="--height: 94.92px;">
                <img src="${illSrc}" alt="曲绘" onerror="this.src='./illustration/default.png'">
              </div>
              <div class="rank-${song.diff}" style="--height: 31.32px;">
                <div class="org">${song.diff} ${constStr}</div>
                <div class="rel">${rksStr}</div>
              </div>
            </div>
            <div class="info-${song.diff}">
              <div class="songname"><p style="font-size:${fontSize}px;">${song.title}</p></div>
              <div class="songinfo">
                <div class="Rating"><img src="${rankImg}" alt="评级" onerror="this.src='./rank/v.png'"></div>
                <div class="chengji">
                  <div class="score"><p>${song.score}</p></div>
                  <div style="width:95%; border-bottom: 2px solid white; margin: 4px 0;"></div>
                  <div class="acc-box">
                    <div class="acc"><p>${song.acc.toFixed(2)}%</p></div>
                    <div class="suggest suggest-kind-${suggestType}">
                      <div class="suggest-tip"></div>
                      <p>${suggestText}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>`;
      }

      mainGrid.innerHTML = diagHtml;
      mainList.forEach((song, idx) => {
        const isPhi = idx < 3;
        const label = isPhi ? `Phi${idx+1}` : `#${idx-2}`;
        mainGrid.innerHTML += buildSongCard(song, label, isPhi);
      });

      if (overflowList.length > 0) {
        overflowDivider.style.display = 'flex';
        overflowGrid.style.display = 'grid';
        overflowGrid.innerHTML = '';
        overflowList.forEach((song, idx) => {
          overflowGrid.innerHTML += buildSongCard(song, `#${idx+28}`, false);
        });
      } else {
        overflowDivider.style.display = 'none';
        overflowGrid.style.display = 'none';
      }

      // 定数模式
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const mode = parseInt(this.dataset.mode);
          if (mode === currentMode) return;
          currentMode = mode;
          document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          document.querySelector('.mode-label').textContent = labelMap[mode];
          renderPage();
        });
      });

      // 背景
      const bgName = gameuser.background || 'default';
      bkgImg.src = `./illustration/${bgName}.png`;
      bkgImg.onerror = function() { this.style.display = 'none'; };
    }

    // ======================== API 获取 ========================
    async function fetchAndGenerate() {
      const credential = credentialInput.value.trim();
      if (!credential) { setStatus('error', '请输入凭证', '⚠️'); return; }

      const body = credentialMode === 'session'
        ? { token: credential }
        : { api_user_id: credential };

      setStatus('loading', '正在获取云存档...', '⏳');
      fetchBtn.disabled = true;
      fetchBtn.innerHTML = '<span class="spinner"></span> 加载中...';

      try {
        const response = await fetch('https://phib19.top:8080/get/cloud/saves', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(body)
        });
        const contentType = response.headers.get('content-type') || '';
        let data;
        if (contentType.includes('application/json')) {
          data = await response.json();
        } else {
          const text = await response.text();
          try { data = JSON.parse(text); } catch (_) {
            throw new Error('服务器返回非 JSON: ' + text.slice(0, 120));
          }
        }
        if (!response.ok) throw new Error(data?.error || data?.message || `HTTP ${response.status}`);
        if (!data || typeof data !== 'object') throw new Error('返回数据格式异常');

        rawData = data;
        saveRawData(rawData);
        playerData = data.data || data;

        setStatus('success', '✅ 获取成功！原始数据已自动保存', '✅');
        if (Object.keys(diffMapDefault).length === 0) await loadDifficulty();
        renderPage();
      } catch (err) {
        console.error(err);
        let msg = err.message || '未知错误';
        if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
          msg = '网络请求失败，请检查网络或 CORS 配置';
        }
        setStatus('error', '❌ ' + msg, '❌');
        mainGrid.innerHTML = `<div class="diagnostic-box" style="color:#f28b82;border-color:#f28b82;">${msg}</div>`;
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerHTML = '📥 获取并生成 B30';
      }
    }

    // ======================== 截图 ========================
    function saveAsImage() {
      const btn = document.getElementById('saveBtn');
      btn.textContent = '⏳ 生成中...';
      btn.disabled = true;
      requestAnimationFrame(() => {
        html2canvas(document.body, {
          scale: 2, useCORS: true, allowTaint: true,
          backgroundColor: null, logging: false,
          ignoreElements: el => el.id === 'saveBtn' || el.closest('.save-btn-wrap')
        }).then(canvas => {
          const name = currentPlayerName || 'Unknown';
          const time = formatDateForFilename(currentTimeStr) || new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
          const link = document.createElement('a');
          link.download = `${name}_${time}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          btn.textContent = '📸 保存为图片';
          btn.disabled = false;
        }).catch(err => {
          console.error('截图失败:', err);
          alert('截图生成失败，请尝试手动截图。');
          btn.textContent = '📸 保存为图片';
          btn.disabled = false;
        });
      });
    }

    // ======================== 事件绑定 ========================
    credentialModeToggle.addEventListener('click', function(e) {
      const btn = e.target.closest('button');
      if (!btn) return;
      const mode = btn.dataset.mode;
      if (mode === credentialMode) return;
      credentialModeToggle.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      credentialMode = mode;
      if (mode === 'session') {
        credentialLabel.textContent = 'Session Token';
        credentialInput.placeholder = '例如: uhrmqs8v0mmn0ikzxqgozrctr';
        credentialHint.textContent = '输入你的游戏 Session Token';
      } else {
        credentialLabel.textContent = 'API User ID';
        credentialInput.placeholder = '例如: 1934128044';
        credentialHint.textContent = '输入你的 API 用户 ID（不需要 Token）';
      }
      hideStatus();
      credentialInput.value = '';
    });

    scanBtn.addEventListener('click', startScanFlow);
    fetchBtn.addEventListener('click', fetchAndGenerate);
    credentialInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); fetchAndGenerate(); }
    });

    clearBtn.addEventListener('click', function() {
      rawData = null; playerData = null; clearRawData();
      mainGrid.innerHTML = ''; overflowGrid.innerHTML = '';
      overflowDivider.style.display = 'none';
      playerInfoContainer.innerHTML = '';
      b30Toolbar.style.display = 'none';
      hideStatus();
      credentialInput.value = '';
      qrContainer.classList.remove('active');
      qrCodeDiv.innerHTML = '';
      qrError.textContent = '';
      abortScan = true;
    });

    exportBtn.addEventListener('click', exportRawJSON);
    document.getElementById('saveBtn').addEventListener('click', saveAsImage);

    // 启动
    window.addEventListener('DOMContentLoaded', async function() {
      await loadDifficulty();
      const cached = loadRawData();
      if (cached) {
        rawData = cached;
        playerData = cached.data || cached;
        renderPage();
        setStatus('success', '💾 已加载本地缓存的云存档数据', '💾');
        b30Toolbar.style.display = 'flex';
        cacheInfo.textContent = '💾 数据已缓存';
      } else {
        mainGrid.innerHTML = '<p style="color:rgba(255,255,255,0.5);text-align:center;width:100%;">暂无数据，请获取云存档或扫码登录。</p>';
      }
    });
  </script>
</body>
</html>
